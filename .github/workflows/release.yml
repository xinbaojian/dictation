name: Release

# 打 tag（形如 v0.1.0）推到 GitHub 时，自动构建并发布所有平台的安装包：
#   Windows：NSIS .exe（x64 / x86-32位 / arm64）
#   macOS  ：universal .dmg（x64 + arm64；Apple 已不支持 32 位，故无 32 位包）
#   Linux  ：.deb + AppImage 通用包（x86_64 / i686-32位 / aarch64）
on:
  push:
    tags:
      - 'v*'

# 允许 workflow 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  # ---------- Windows：NSIS 安装包（x64 / x86 / arm64） ----------
  build-windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    # fail-fast=false：某个架构失败不连累其它架构
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (NSIS)
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**

  # ---------- macOS：universal .dmg（x64 + arm64） ----------
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (with universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (universal dmg)
        # 构建 universal 包，Intel 与 Apple Silicon 都能装；
        # 无签名证书时用 ad-hoc 签名，用户首次打开会看到“未知开发者”提示（属正常）。
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/**

  # ---------- Linux：.deb + AppImage（x86_64 / i686 / aarch64） ----------
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
          - target: i686-unknown-linux-gnu
            arch: i386
            linker: i686-linux-gnu-gcc
            cargo_env: I686_UNKNOWN_LINUX_GNU
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            linker: aarch64-linux-gnu-gcc
            cargo_env: AARCH64_UNKNOWN_LINUX_GNU
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install base Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # 32 位（i686）需要开启 i386 架构并装对应的 32 位开发库
      - name: Install 32-bit (i386) dependencies
        if: matrix.arch == 'i386'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            gcc-multilib g++-multilib gcc-i686-linux-gnu g++-i686-linux-gnu \
            libwebkit2gtk-4.1-dev:i386 libayatana-appindicator3-dev:i386 \
            librsvg2-dev:i386 libgtk-3-dev:i386 libssl-dev:i386

      # arm64 需要开启 arm64 架构、装对应的开发库与交叉链接器
      - name: Install arm64 (aarch64) dependencies + linker
        if: matrix.arch == 'arm64'
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64 libgtk-3-dev:arm64 libssl-dev:arm64

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Set cross linker (non-native arch)
        if: matrix.arch != 'amd64'
        run: echo "CARGO_TARGET_${{ matrix.cargo_env }}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (deb + AppImage)
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles deb --bundles appimage

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**

  # ---------- 汇总并发布 ----------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 根据 tag 自动生成更新说明
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
