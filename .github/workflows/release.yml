name: Release

# 打 tag（形如 v0.1.0）推到 GitHub 时，自动构建 Windows 安装包（NSIS .exe）
# 与 macOS 安装包（.dmg，universal 架构），并发布到 GitHub Release。
on:
  push:
    tags:
      - 'v*'

# 允许 workflow 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  # ---------- Windows：NSIS 安装包 ----------
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (NSIS)
        # --bundles nsis 只出 Windows 安装包；与 Makefile 的 build 目标一致
        run: npm run tauri -- build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          # 与 Makefile 中 BUNDLE_DIR 保持一致
          path: src-tauri/target/release/bundle/nsis/*.exe

  # ---------- macOS：universal .dmg ----------
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (with universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (universal dmg)
        # 构建 universal 包，Intel 与 Apple Silicon 都能装；
        # 无签名证书时用 ad-hoc 签名，用户首次打开会看到“未知开发者”提示（属正常）。
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ---------- 汇总并发布 ----------
  release:
    name: Publish Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 根据 tag 自动生成更新说明
          generate_release_notes: true
          files: |
            artifacts/windows-installer/*.exe
            artifacts/macos-installer/*.dmg
