name: Release

# 打 tag（形如 v0.1.0）推到 GitHub 时，自动构建并发布所有平台的安装包：
#   Windows：NSIS .exe（x64 / arm64；2026-11-08 起不再出 32 位包——
#            sherpa-onnx 预编译库没有 win-x86 架构，本地 TTS 语音包无法链接）
#   macOS  ：universal .dmg（x64 + arm64 双架构合一；Apple 已不支持 32 位）
#   Linux  ：.deb + AppImage 通用包（x86_64 / aarch64；32 位 Linux 因系统已无 i386 桌面库，无法构建）
#
# 同时产出自动升级所需的签名产物（*.sig / macOS 的 *.app.tar.gz）与 latest.json。
# 构建时的私钥来自仓库 Secret TAURI_SIGNING_PRIVATE_KEY，公钥写在 tauri.conf.json。
on:
  push:
    tags:
      - 'v*'

# 允许 workflow 创建 Release 并上传附件
permissions:
  contents: write

jobs:
  # ---------- Windows：NSIS 安装包（x64 / arm64） ----------
  build-windows:
    name: Windows (${{ matrix.target }})
    runs-on: windows-latest
    # fail-fast=false：某个架构失败不连累其它架构
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (NSIS)
        env:
          # 没有私钥时不会生成 .sig，release job 的清单脚本会直接失败（防止发出无法升级的版本）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 本项目密钥无密码，但必须显式给空值：否则 CLI 会交互式索要密码，CI 里会卡住
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**

  # ---------- macOS：universal .dmg（x64 + arm64） ----------
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust (with universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (universal dmg + updater app)
        # 构建 universal 包，Intel 与 Apple Silicon 都能装；
        # 无签名证书时用 ad-hoc 签名，用户首次打开会看到“未知开发者”提示（属正常）。
        # createUpdaterArtifacts=true 只在 bundles 里含 `app` 时才会产出更新包
        # Dictation.app.tar.gz（+ .sig）——只写 dmg 不产（Tauri CLI 2.x bundler 的行为，
        # v0.3.0/v0.4.0 因此发过没有 darwin 键的 latest.json，macOS 客户端检查更新全部报错）。
        # dmg 供人工下载安装，app 包给 updater 用，两个都要。
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 本项目密钥无密码，但必须显式给空值：否则 CLI 会交互式索要密码，CI 里会卡住
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run tauri -- build --target universal-apple-darwin --bundles app --bundles dmg

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          # 只传更新包与 dmg，别把 Dictation.app 整个目录树带进 artifact（几十 MB）；
          # 多路径时 upload-artifact 以 bundle/ 为公共根，下载解包后结构与脚本预期一致
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # ---------- Linux：.deb + AppImage（x86_64 原生 / aarch64 原生 ARM runner） ----------
  # 说明：Ubuntu 22.04 起已裁撤 i386 桌面库（webkit2gtk / gtk 无 32 位开发包），
  # 无法构建 32 位 Linux 包。全平台 32 位于 2026-11-08 起停止支持（见 Windows 段注释）。
  build-linux:
    name: Linux (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri (deb + AppImage)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 本项目密钥无密码，但必须显式给空值：否则 CLI 会交互式索要密码，CI 里会卡住
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles deb --bundles appimage

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**

  # ---------- 汇总并发布 ----------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      # 默认浅克隆只有 1 个 commit，取不到上一个 tag；整理提交说明需要完整历史
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes from commits
        # GitHub 自带的 generate_release_notes 只汇总 PR，本仓库直接 push commit，
        # 所以改由脚本按 commit message 分组生成，Full Changelog 链接也由脚本补上。
        run: node scripts/gen-release-notes.mjs "${{ github.ref_name }}" release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate updater manifest
        # 扫描各平台的 .sig，生成 latest.json；端点是 releases/latest/download/latest.json。
        # 更新包本体（尤其 macOS 的 .app.tar.gz）必须一并上传，否则清单里的 url 会 404。
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/gen-updater-manifest.mjs "${{ github.ref_name }}" artifacts latest.json

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.AppImage
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            latest.json
