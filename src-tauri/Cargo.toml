[package]
name = "dictation"
version = "0.4.1"
description = "生词默写提问小工具"
edition = "2021"
# tauri-plugin-updater 要求 Rust >= 1.90
rust-version = "1.90"

[lib]
name = "dictation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# 单实例：第二个进程会在启动时替换 / checkpoint 同一个 SQLite 库，
# 与同步的 pending 替换叠加会静默丢数据，必须挡住
tauri-plugin-single-instance = "2"
# 自有 MySQL 快照同步（默认不启用；只有配置了连接信息才联网）
mysql = "28.0.4"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
