[package]
name = "dictation"
version = "0.8.0"
description = "生词默写提问小工具"
edition = "2021"
# tauri-plugin-updater 要求 Rust >= 1.90
rust-version = "1.90"

[lib]
name = "dictation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
rand = "0.8"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
# 更新说明里的链接用系统浏览器打开（用户点击才触发，不改变离线定位）
tauri-plugin-opener = "2"
# 单实例：第二个进程会在启动时替换 / checkpoint 同一个 SQLite 库，
# 与同步的 pending 替换叠加会静默丢数据，必须挡住
tauri-plugin-single-instance = "2"
# 自有 MySQL 快照同步（默认不启用；只有配置了连接信息才联网）
mysql = "28.0.4"
sha2 = "0.10"
# AI 讲解卡：OpenAI 兼容对话（默认不启用；只有配置了 .ai-config.json 才联网）。
# rustls 避免跨平台拉系统 OpenSSL
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# 本地 TTS 运行时：sherpa-onnx 官方 Rust 绑定（默认静态链接，
# build.rs 自动从 GitHub Releases 下载平台预编译库，无需 cmake；
# 离线构建可用 SHERPA_ONNX_ARCHIVE_DIR 覆盖）。模型本体不随包，见 tts/
sherpa-onnx = "2.0.1"
# 播放合成音频：直接喂 f32 样本缓冲，只要 playback（cpal），不要解码器
rodio = { version = "0.23", default-features = false, features = ["playback"] }
# 语音包是 GitHub Releases 的 .tar.bz2：纯 Rust 解压，tar 条目做路径穿越防护
bzip2 = "0.6"
tar = "0.4"
# 朗读音频缓存（tts-cache/）的 WAV 读写
hound = "3.5"

# 朗读（SAPI ISpVoice）只在 Windows 上编译
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_Media_Speech"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
